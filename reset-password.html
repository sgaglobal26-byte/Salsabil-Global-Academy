<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#063c35">
<title>পাসওয়ার্ড পরিবর্তন | Salsabil Global Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#073b36,#122e43);font-family:Arial,'Noto Sans Bengali',sans-serif;color:#203a33}.card{width:min(100%,440px);background:#fff;border-radius:18px;padding:30px;box-shadow:0 22px 70px #001a1240}.brand{text-align:center;color:#073b36;font-size:22px;font-weight:700}.sub{text-align:center;color:#718078;font-size:14px;line-height:1.6}.field{margin:18px 0}.field label{display:block;margin-bottom:7px;font-size:14px}.field input{width:100%;padding:12px;border:1px solid #dce5de;border-radius:9px;font-size:16px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#075b45;color:white;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{padding:12px;border-radius:9px;background:#f1f6f1;color:#24513c;font-size:14px;line-height:1.6;display:none}.err{background:#fff0f0;color:#a32929}.back{display:block;text-align:center;margin-top:18px;color:#075b45}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="card">
<div class="brand">সালসাবিল গ্লোবাল একাডেমি</div>
<p class="sub">নতুন Admin Password সেট করুন</p>
<div id="message" class="msg" role="status"></div>
<form id="resetForm" style="display:none">
<div class="field"><label for="password">নতুন পাসওয়ার্ড</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="কমপক্ষে ৮ অক্ষর"></div>
<div class="field"><label for="confirmPassword">নতুন পাসওয়ার্ড নিশ্চিত করুন</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="আবার পাসওয়ার্ড লিখুন"></div>
<button class="btn" id="saveButton" type="submit">নতুন পাসওয়ার্ড সংরক্ষণ</button>
</form>
<a class="back" href="/admin.html">Admin Login-এ ফিরে যান</a>
</main>
<script>
(async function(){
 const box=document.getElementById('message'),form=document.getElementById('resetForm'),button=document.getElementById('saveButton');
 const show=(message,error=false)=>{box.textContent=message;box.className='msg'+(error?' err':'');box.style.display='block';};
 const createClient=window.supabase&&window.supabase.createClient;
 if(!createClient){show('নিরাপদ লগইন লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে Refresh করুন।',true);return;}
 const client=createClient('https://qzblmxcbgmdwkdmfsvuj.supabase.co','sb_publishable_H7aYU2ThzGoXQnSVZTPO2w_PL3WZWsF');
 let recoveryReady=false;
 const {data:{subscription}}=client.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;form.style.display='block';show('নতুন পাসওয়ার্ড দিন।');}
 });
 const {data,error}=await client.auth.getSession();
 if(error){show('Reset Session যাচাই করা যায়নি: '+error.message,true);return;}
 if(data.session){recoveryReady=true;form.style.display='block';show('নতুন পাসওয়ার্ড দিন।');}
 else if(!location.hash&&!location.search){show('Reset লিংকটি অসম্পূর্ণ বা মেয়াদ শেষ হয়েছে। Admin Login থেকে নতুন Reset Email পাঠান।',true);}
 else{show('Reset লিংক যাচাই হচ্ছে। কয়েক সেকেন্ড অপেক্ষা করে পেজ Refresh করুন।');}
 form.addEventListener('submit',async event=>{
   event.preventDefault();
   if(!recoveryReady){show('Password Reset Session পাওয়া যায়নি। নতুন Reset Email পাঠান।',true);return;}
   const password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;
   if(password.length<8){show('পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।',true);return;}
   if(password!==confirm){show('দুটি পাসওয়ার্ড এক হয়নি। আবার লিখুন।',true);return;}
   button.disabled=true;button.textContent='সংরক্ষণ হচ্ছে...';
   const {error:updateError}=await client.auth.updateUser({password});
   button.disabled=false;button.textContent='নতুন পাসওয়ার্ড সংরক্ষণ';
   if(updateError){show('পাসওয়ার্ড পরিবর্তন হয়নি: '+updateError.message,true);return;}
   show('সফল! নতুন পাসওয়ার্ড সংরক্ষিত হয়েছে। এখন Admin Login-এ গিয়ে নতুন পাসওয়ার্ড দিয়ে প্রবেশ করুন।');
   form.style.display='none';
   await client.auth.signOut();
 });
 window.addEventListener('beforeunload',()=>subscription.unsubscribe());
})();
</script>
</body></html>
