<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Leadership Manager | Salsabil Global Academy</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#17352d;font-family:'Hind Siliguri',sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.panel{background:white;border:1px solid #dfe8e1;border-radius:15px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:10px 0}.field label{display:block;font-weight:600;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dfe8e1;border-radius:8px;font:inherit}.field textarea{min-height:140px}.btn{border:0;border-radius:9px;padding:10px 16px;background:#075b45;color:white;font:600 14px 'Hind Siliguri';cursor:pointer}.alt{background:#e7f0e8;color:#075b45}.hidden{display:none}.item{background:#fff;border:1px solid #dfe8e1;border-radius:12px;padding:14px;margin:10px 0}.item img{width:75px;height:85px;object-fit:cover;border-radius:9px}.itemhead{display:flex;gap:12px;align-items:center}.muted{color:#6c7b73;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><header><h1>চেয়ারম্যান, প্রধান শিক্ষক ও শিক্ষক পরিচিতি</h1><p>ছবি, পদবি ও বাণী প্রকাশ/সম্পাদনার ব্যবস্থা</p><a class="btn alt" href="/admin.html">Admin Dashboard</a> <a class="btn alt" href="/">ওয়েবসাইট</a></header>
<section id="login" class="panel"><h2>Admin Login</h2><form id="loginForm"><div class="field"><label>ইমেইল</label><input name="email" type="email" required></div><div class="field"><label>পাসওয়ার্ড</label><input name="password" type="password" required></div><button class="btn">লগইন</button><p id="loginMsg"></p></form></section>
<section id="app" class="hidden"><div class="panel"><h2 id="formTitle">নতুন ব্যক্তির তথ্য যোগ করুন</h2><form id="form"><div class="grid"><div class="field"><label>পদ/বিভাগ</label><select id="role"><option value="chairman">চেয়ারম্যান</option><option value="headmaster">প্রধান শিক্ষক</option><option value="director">পরিচালক</option><option value="teacher">শিক্ষক/শিক্ষিকা</option><option value="administrator">অন্যান্য প্রশাসনিক দায়িত্ব</option></select></div><div class="field"><label>প্রদর্শনের ক্রম</label><input id="sort" type="number" value="1"></div></div><div class="grid"><div class="field"><label>নাম</label><input id="name" required maxlength="150"></div><div class="field"><label>বিস্তারিত পদবি</label><input id="designation" maxlength="180" placeholder="যেমন: প্রতিষ্ঠাতা চেয়ারম্যান"></div></div><div class="field"><label>বাণী / পরিচিতি</label><textarea id="message" required placeholder="ব্যক্তির বক্তব্য বা সংক্ষিপ্ত পরিচিতি লিখুন"></textarea></div><div class="field"><label>ছবি (JPG, PNG বা WebP; সর্বোচ্চ ৫ MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted">ছবি আপলোড ঐচ্ছিক। নতুন ছবি না দিলে আগের ছবিটি থাকবে।</p></div><div class="field"><label><input id="published" type="checkbox" checked style="width:auto"> ওয়েবসাইটে প্রকাশ করুন</label></div><button class="btn" id="save">সংরক্ষণ</button> <button class="btn alt" type="button" id="reset">নতুন এন্ট্রি</button><p id="msg"></p></form></div><div class="panel"><h2>ব্যক্তিদের তালিকা</h2><div id="list">লোড হচ্ছে...</div></div></section></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://qzblmxcbgmdwkdmfsvuj.supabase.co','sb_publishable_H7aYU2ThzGoXQnSVZTPO2w_PL3WZWsF');const $=id=>document.getElementById(id);let records=[],editing=null,oldPhoto=null;
const roleName={chairman:'চেয়ারম্যান',headmaster:'প্রধান শিক্ষক',director:'পরিচালক',teacher:'শিক্ষক/শিক্ষিকা',administrator:'প্রশাসনিক কর্মকর্তা'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function check(){let{data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}let{data,error}=await db.from('user_roles').select('role').eq('user_id',session.user.id).eq('role','admin').maybeSingle();if(error||!data){await db.auth.signOut();$('loginMsg').textContent='এই অ্যাকাউন্টে Admin অনুমতি নেই';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('loginMsg').textContent=error.message;return}await check()};
async function load(){let{data,error}=await db.from('leadership_profiles').select('*').order('sort_order');if(error){$('list').textContent='Migration চালানো হয়নি বা অনুমতি নেই: '+error.message;return}records=data||[];$('list').innerHTML=records.map(r=>{let url=r.photo_path?db.storage.from('leadership-photos').getPublicUrl(r.photo_path).data.publicUrl:'';return '<article class="item"><div class="itemhead">'+(url?'<img src="'+esc(url)+'" alt="">':'')+'<div><b>'+esc(r.name_bn)+'</b><div>'+esc(r.designation_bn||roleName[r.role_key])+'</div><small class="muted">'+(r.is_published?'প্রকাশিত':'অপ্রকাশিত')+'</small></div></div><p>'+esc(r.message_bn)+'</p><button class="btn alt" data-edit="'+r.id+'">সম্পাদনা</button> <button class="btn alt" data-del="'+r.id+'">মুছুন</button></article>'}).join('')||'এখনো কোনো ব্যক্তির তথ্য যোগ করা হয়নি।'}
function reset(){editing=null;oldPhoto=null;$('form').reset();$('sort').value=1;$('published').checked=true;$('formTitle').textContent='নতুন ব্যক্তির তথ্য যোগ করুন'}
$('reset').onclick=reset;
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;let{data:{user}}=await db.auth.getUser();let photoPath=oldPhoto;let file=$('photo').files[0];if(file){if(file.size>5*1024*1024){$('msg').textContent='ছবির সাইজ ৫ MB-এর বেশি';$('save').disabled=false;return}let ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';let path=user.id+'/'+crypto.randomUUID()+'.'+ext;let{error:upErr}=await db.storage.from('leadership-photos').upload(path,file,{contentType:file.type,upsert:false});if(upErr){$('msg').textContent='ছবি আপলোড হয়নি: '+upErr.message;$('save').disabled=false;return}photoPath=path}
let row={role_key:$('role').value,role_bn:roleName[$('role').value],name_bn:$('name').value.trim(),designation_bn:$('designation').value.trim(),message_bn:$('message').value.trim(),photo_path:photoPath,sort_order:Number($('sort').value)||1,is_published:$('published').checked,updated_by:user.id,updated_at:new Date().toISOString()};
let q=editing?db.from('leadership_profiles').update(row).eq('id',editing):db.from('leadership_profiles').insert(row);let{error}=await q;$('save').disabled=false;if(error){$('msg').textContent='সংরক্ষণ হয়নি: '+error.message;return}$('msg').textContent='তথ্য সংরক্ষিত হয়েছে';reset();await load()};
$('list').onclick=async e=>{let edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(edit){let r=records.find(x=>x.id===edit.dataset.edit);editing=r.id;oldPhoto=r.photo_path;$('role').value=r.role_key;$('name').value=r.name_bn;$('designation').value=r.designation_bn||'';$('message').value=r.message_bn;$('sort').value=r.sort_order;$('published').checked=r.is_published;$('formTitle').textContent='তথ্য সম্পাদনা';scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('এই তথ্য মুছবেন?')){let r=records.find(x=>x.id===del.dataset.del);let{error}=await db.from('leadership_profiles').delete().eq('id',r.id);if(error){alert(error.message);return}if(r.photo_path)await db.storage.from('leadership-photos').remove([r.photo_path]);await load()}};
await check();db.auth.onAuthStateChange(()=>check());
</script></body></html>
